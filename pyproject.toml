[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mekiki"
description = "A scikit-learn-compatible library that turns unstructured columns into typed features and puts an LLM on top of statistical models"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Atsushi Matsumoto" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["automl", "feature-engineering", "llm", "scikit-learn", "tabular"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
]

dynamic = ["version"]

[project.optional-dependencies]
models = ["lightgbm", "xgboost"]
llm = ["anthropic"]
litellm = ["litellm>=1.101.0"]
embed = ["sentence-transformers"]
all = ["mekiki[models,llm,litellm,embed]"]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/attuan/mekiki"

[tool.hatch.version]
path = "mekiki/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mekiki"]

[tool.hatch.build.targets.wheel.force-include]
"sampledata/sample/vehicles_sample500.csv" = "mekiki/data/vehicles_sample500.csv"
"sampledata/sample/news_sample500.csv"     = "mekiki/data/news_sample500.csv"
"sampledata/sample/bank_sample500.csv"     = "mekiki/data/bank_sample500.csv"

[tool.hatch.build.targets.sdist]
include = [
    "mekiki",
    "tests",
    "sampledata/sample/vehicles_sample500.csv",
    "sampledata/sample/news_sample500.csv",
    "sampledata/sample/bank_sample500.csv",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
